<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ 'Edit employee' if employee else 'Add employee' }} · Marketlane</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='schedule.css') }}">
  </head>
  <body>
    <main class="main-content">
      <header class="topbar">
        <div class="page-intro">
          <p class="eyebrow">Downtown market <span></span> Team management</p>
          <h1>{{ 'Edit employee' if employee else 'Add employee' }}</h1>
        </div>
      </header>

      <section class="team-card" aria-labelledby="employee-form-title">
        <h2 id="employee-form-title">Employee details</h2>
        {% if error %}<p role="alert">{{ error }}</p>{% endif %}
        <form method="post">
          <p>
            <label for="name">Name</label>
            <input id="name" name="name" required value="{{ employee.name if employee else '' }}">
          </p>
          <p>
            <label for="role">Role</label>
            <input id="role" name="role" required value="{{ employee.role if employee else '' }}">
          </p>
          {% if employee %}
            <p>
              <label><input type="checkbox" name="active"{% if employee.active %} checked{% endif %}> Active employee</label>
            </p>
          {% endif %}
          <p>
            <button class="add-shift-button" type="submit">{{ 'Save changes' if employee else 'Add employee' }}</button>
            <a class="text-button" href="{{ url_for('employees') }}">Cancel</a>
          </p>
        </form>
        {% if employee and employee.active %}
          <form method="post" action="{{ url_for('deactivate_employee', employee_id=employee.id) }}">
            <button class="text-button" type="submit">Deactivate employee</button>
          </form>
        {% endif %}
      </section>
    </main>
  </body>
</html>
